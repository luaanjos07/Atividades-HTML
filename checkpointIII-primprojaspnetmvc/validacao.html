<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Validação de Formulário</title>
    <style>
        /* Estilos fáceis e diretos, típicos de quem está aprendendo a estilizar caixas */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Menu de Navegação */
        .menu {
            margin-bottom: 20px;
            background-color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .menu a {
            text-decoration: none;
            color: #333;
            margin: 0 10px;
            font-weight: bold;
        }

        .menu a.ativo {
            color: #007bff;
        }

        /* Container do Formulário */
        .box {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        /* Campos do formulário */
        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Garante que o input não passe da caixa */
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Parágrafo de erro solicitado */
        #erro {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Menu para facilitar ir para o contador -->
    <div class="menu">
        <a href="validacao.html" class="ativo">1. Validação</a>
        <a href="contador.html">2. Contador</a>
    </div>

    <div class="box">
        <h2>Formulário de Cadastro</h2>
        
        <form id="meuFormulario">
            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="text" id="email" name="email" placeholder="exemplo@email.com">
            </div>

            <div class="campo">
                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" placeholder="Sua idade atual">
            </div>

            <button type="submit">Enviar Formulário</button>
        </form>

        <!-- Único parágrafo solicitado para exibir mensagens (<p id="erro">) -->
        <p id="erro"></p>
    </div>

    <!-- Script src antes do fechamento de body conforme solicitado -->
    <script src="validacao.js"></script>
</body>
</html>
